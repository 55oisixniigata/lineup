name: Update Stats JSON

on:
  schedule:
    # 毎日 21:00 UTC = 翌 06:00 JST
    - cron: "0 21 * * *"
  workflow_dispatch:  # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch stats from NPB
        run: python scripts/fetch_stats.py

      - name: Commit and push stats.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && echo "変更なし" || (
            git commit -m "📊 Stats update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          )
